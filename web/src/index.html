<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PrusaCam byClaude</title>
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <section id="login" class="login" hidden>
    <img src="icons/logo.svg" alt="Prusa Connect ESP32 cam">
    <p class="lead" id="setup-hint" hidden>First run: create the user that will manage the camera.</p>
    <form id="login-form">
      <div style="display:flex;flex-direction:column;gap:.6rem">
        <input name="username" autocomplete="username" placeholder="Username" required>
        <div class="pw-wrap">
          <input name="password" type="password" autocomplete="current-password" placeholder="Password" required minlength="8">
          <button type="button" class="pw-eye" aria-label="Show password"><img src="icons/eye.svg" alt="" width="18"></button>
        </div>
        <div class="pw-wrap" id="confirm-wrap" hidden>
          <input name="confirm" type="password" autocomplete="new-password" placeholder="Repeat password" minlength="8">
          <button type="button" class="pw-eye" aria-label="Show password"><img src="icons/eye.svg" alt="" width="18"></button>
        </div>
        <button class="btn" type="submit" id="login-submit">Sign in</button>
        <div class="error" id="login-error"></div>
      </div>
    </form>
  </section>

  <div id="app" hidden>
    <header class="topbar">
      <img class="logo" src="icons/logo.svg" alt="Prusa Connect ESP32 cam">
      <nav>
        <a href="https://connect.prusa3d.com" target="_blank" rel="noopener">PrusaConnect</a>
        <a href="https://help.prusa3d.com/guide/esp-camera-for-prusa-connect_390199" target="_blank" rel="noopener">Help</a>
      </nav>
      <span class="spacer"></span>
      <nav class="actions">
        <button class="link" id="light-toggle" type="button"><img class="icon" id="light-icon" src="icons/light-off-icon.svg" alt=""> Light</button>
        <button class="link" id="refresh" type="button"><img class="icon" src="icons/refresh-icon.svg" alt=""> Refresh</button>
        <button class="link" id="reboot" type="button"><img class="icon" src="icons/reboot-icon.svg" alt=""> Reboot</button>
        <button class="link" id="logout" type="button">Log out</button>
      </nav>
    </header>
    <hr>

    <main>
      <section class="hero">
        <div class="snapshot">
          <img id="photo" alt="Latest snapshot">
          <div class="caption" id="photo-caption"></div>
        </div>
        <div class="side">
          <p class="lead">PrusaConnect: <span class="state" id="connect-state">…</span></p>
          <p class="lead">Interval: <b id="interval">…</b></p>
          <p class="lead">Last upload: <b id="last-upload">…</b></p>
          <p class="lead" id="printer-line" hidden>Printer: <b id="printer-state">…</b></p>
          <button class="btn" id="snap-now" type="button">Take and send snapshot</button>
          <a class="btn" id="download" href="api/v1/snapshot.jpg" download="snapshot.jpg"
             style="display:inline-flex;align-items:center;justify-content:center;text-decoration:none">Download snapshot</a>
        </div>
      </section>

      <nav class="tabs" id="tabs">
        <a href="#camera">Camera</a>
        <a href="#connect">PrusaConnect</a>
        <a href="#printer">Printer</a>
        <a href="#network">Network</a>
        <a href="#storage">Storage</a>
        <a href="#mqtt">MQTT</a>
        <a href="#system">System</a>
      </nav>
      <hr>
      <section class="panel" id="view" aria-live="polite"></section>
    </main>

    <footer>
      <span><b>PrusaCam byClaude</b> <span id="version"></span></span>
      <span>Based on Prusa-Firmware-ESP32-Cam by Miroslav Pivovarsky · GPL-3.0</span>
    </footer>
  </div>
</body>
</html>
